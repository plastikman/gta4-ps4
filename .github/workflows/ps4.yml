name: PS4 CI

on:
  pull_request:
    branches: [ps4-port]
  push:
    branches: [ps4-port]
  workflow_dispatch:
    inputs:
      build_package:
        description: 'Build PKG (requires an online gta4-ps4-build runner with /orbis-cache)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ps4-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ffmpeg-assembly:
    name: FFmpeg NASM assembly
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install NASM
        run: |
          sudo apt-get update
          sudo apt-get install --yes nasm
      - name: Assemble PS4 FFmpeg routines
        run: ps4/ci-check-ffmpeg-asm.sh

  orbis-build-package:
    name: Orbis build and package validation
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.build_package)
    runs-on: gta4-ps4-build
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: plastikman/orbis-win
          ref: 9791d98942851163a9b94548c04a7dbb07fe8895
          path: orbis-win
          persist-credentials: false
      - name: Install LLVM 19.1.7 and build tools
        run: |
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key |
            sudo tee /etc/apt/keyrings/apt.llvm.org.asc >/dev/null
          echo "deb [signed-by=/etc/apt/keyrings/apt.llvm.org.asc] http://apt.llvm.org/noble/ llvm-toolchain-noble-19 main" |
            sudo tee /etc/apt/sources.list.d/llvm-19.list >/dev/null
          printf 'Package: *\nPin: release o=apt.llvm.org\nPin-Priority: 1001\n' |
            sudo tee /etc/apt/preferences.d/llvm-19 >/dev/null
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential clang-19 lld-19 llvm-19 cmake ninja-build nasm \
            glslang-tools git python3 curl pkg-config
          for tool in clang clang++ lld ld.lld llvm-ar llvm-ranlib llvm-nm \
                      llvm-objcopy llvm-readelf llvm-strip; do
            sudo ln -sfn "/usr/bin/${tool}-19" "/usr/local/bin/$tool"
          done
          clang --version | grep -q 'version 19\.1\.7' || {
            echo 'clang must be 19.1.7 to match the validated build workstation' >&2; exit 1; }
      - name: Attach the Orbis-Win Kubernetes runner cache
        run: orbis-win/scripts/ci/prepare-runner.sh
      - name: Build pinned OpenOrbis module stubs
        env:
          PW_MODULE_STUBS_DIR: ${{ github.workspace }}/gta4-openorbis-stubs
        run: orbis-win/scripts/build-openorbis-module-stubs.sh
      - name: Download pinned DXC 1.9.2609
        env:
          PS4_DXC_ROOT: ${{ runner.temp }}/gta4-dxc
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/linux_dxc_2026_09_28.x86_x64.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 --silent --show-error \
            -o "$archive" \
            https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2609/linux_dxc_2026_09_28.x86_x64.tar.gz
          echo '96faadc7f5c282d2ffda49804beb4c3ee38127bc252b723234e3c5cdf7aa39a1  '"$archive" | sha256sum --check
          mkdir -p "$PS4_DXC_ROOT"
          tar --no-same-owner -xzf "$archive" -C "$PS4_DXC_ROOT"
      - name: Allocate isolated build paths
        id: paths
        shell: bash
        run: |
          root="$HOME/codex_scratch/gta4-ps4-ci/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$root"
          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "build=$root/build" >> "$GITHUB_OUTPUT"
          echo "package=$root/package" >> "$GITHUB_OUTPUT"
      - name: Build Orbis EBOOT
        env:
          PS4_SDK_BUNDLE: /home/zpeirce/ps4-gladius/sdk/orbis-sdk-v1
          PS4_BUILD_DIR: ${{ steps.paths.outputs.build }}
          PS4_BUILD_JOBS: 1
          PS4_DXC_ROOT: ${{ runner.temp }}/gta4-dxc
        run: ps4/build-clean.sh
      - name: Build and validate game-free PKG
        env:
          PS4_SDK_BUNDLE: /home/zpeirce/ps4-gladius/sdk/orbis-sdk-v1
          PS4_BUILD_DIR: ${{ steps.paths.outputs.build }}
          PS4_PACKAGE_DIR: ${{ steps.paths.outputs.package }}
          PS4_STUBS_DIR: ${{ github.workspace }}/gta4-openorbis-stubs
          PS4_EXPECTED_LIBC_SHA256: 5680c77d0215ead1c51deb00d76c5347f306e04c81b8b1119c9fd84580ebcf94
          PS4_EXPECTED_FIOS2_SHA256: 0ab6fa2479d1c15ebdc6b7621413bfc9f89b58c97da7563bc804cef3a495ea4a
          PS4_PKGTOOL_OPENSSL_LIB: /orbis-cache/deps/openssl11/lib
        run: ps4/package/build-package.sh
      - name: Record build provenance
        env:
          PS4_SDK_BUNDLE: /home/zpeirce/ps4-gladius/sdk/orbis-sdk-v1
          PS4_PACKAGE_DIR: ${{ steps.paths.outputs.package }}
          PS4_DXC_ROOT: ${{ runner.temp }}/gta4-dxc
          PW_MODULE_STUBS_DIR: ${{ github.workspace }}/gta4-openorbis-stubs
        run: |
          {
            sdk_hash=$(sha256sum "$PS4_SDK_BUNDLE/BUNDLE.txt" | cut -d' ' -f1)
            dxc_version=$("$PS4_DXC_ROOT/bin/dxc" --version 2>&1 | tail -1)
            libc_hash=$(sha256sum "$PW_MODULE_STUBS_DIR/libc.prx" | cut -d' ' -f1)
            fios2_hash=$(sha256sum "$PW_MODULE_STUBS_DIR/libSceFios2.prx" | cut -d' ' -f1)
            echo "gta4_commit=$GITHUB_SHA"
            echo "orbis_win_runner_setup_commit=9791d98942851163a9b94548c04a7dbb07fe8895"
            echo "sdk_bundle_sha256=$sdk_hash"
            echo "dxc_version=$dxc_version"
            echo "dxc_archive_sha256=96faadc7f5c282d2ffda49804beb4c3ee38127bc252b723234e3c5cdf7aa39a1"
            echo "libc_stub_sha256=$libc_hash"
            echo "fios2_stub_sha256=$fios2_hash"
            cat "$PS4_PACKAGE_DIR/SHA256SUMS"
          } > "$PS4_PACKAGE_DIR/BUILD-MANIFEST.txt"
          cat "$PS4_PACKAGE_DIR/BUILD-MANIFEST.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: gta4-ps4-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            ${{ steps.paths.outputs.package }}/out/GTA4.pkg
            ${{ steps.paths.outputs.build }}/glue/gta4-recomp/eboot.bin
            ${{ steps.paths.outputs.package }}/gta4.elf
            ${{ steps.paths.outputs.package }}/SHA256SUMS
            ${{ steps.paths.outputs.package }}/validate.log
            ${{ steps.paths.outputs.package }}/BUILD-MANIFEST.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Clean isolated run data
        if: always() && steps.paths.outputs.root != ''
        env:
          RUN_ROOT: ${{ steps.paths.outputs.root }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import shutil
          from pathlib import Path

          root = Path(os.environ['RUN_ROOT']).resolve()
          parent = (Path.home() / 'codex_scratch/gta4-ps4-ci').resolve()
          if root.parent != parent or not root.name.startswith(f"{os.environ['GITHUB_RUN_ID']}-"):
              raise SystemExit(f"Refusing to clean unexpected path: {root}")
          shutil.rmtree(root, ignore_errors=True)
          PY
